version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/storage/schema.sql"
    queries: "internal/storage/queries"
    gen:
      go:
        package: "db"
        out: "internal/storage/db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: false
        emit_pointers_for_null_types: true
